apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scanrequests.vat.io
spec:
  group: vat.io
  scope: Namespaced
  names:
    plural: scanrequests
    singular: scanrequest
    kind: ScanRequest
    shortNames:
      - vscanreq
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Digest
          type: string
          jsonPath: .spec.digest
        - name: Attempts
          type: integer
          jsonPath: .status.attempts
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - imageRef
              properties:
                imageRef:
                  type: string
                  description: Image ref as observed (registry/repo:tag).
                digest:
                  type: string
                  description: Resolved sha256 digest (dedup key); empty until resolved.
                tags:
                  type: array
                  items:
                    type: string
                scanTypes:
                  type: array
                  items:
                    type: string
                observedRefs:
                  type: array
                  items:
                    type: object
                    properties:
                      namespace:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                      container:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - pending
                    - scanning
                    - done
                    - failed
                attempts:
                  type: integer
                lastError:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                finishedAt:
                  type: string
                  format: date-time
      subresources:
        status: {}
