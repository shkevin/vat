apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scanpolicies.vat.io
spec:
  group: vat.io
  scope: Cluster
  names:
    plural: scanpolicies
    singular: scanpolicy
    kind: ScanPolicy
    shortNames:
      - vsp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: true
                workloadScanning:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    includeInitContainers:
                      type: boolean
                      default: true
                kubernetesConfigScanning:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    includeSecretsMetadata:
                      type: boolean
                      default: true
                rbacScanning:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                nodeScanning:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                lastAppliedAt:
                  type: string
                  format: date-time
      subresources:
        status: {}
