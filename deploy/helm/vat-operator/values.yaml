namespaceOverride: ""

vat:
  url: http://vat-backend.vat.svc.cluster.local:8000
  credentialsSecretName: vat-operator-credentials
  adminTokenKey: adminToken

operator:
  image:
    repository: harbor.automatedhass.com/vat/operator
    tag: latest
    pullPolicy: Always
  runtimeProfile: auto
  # workload = scan all desired-state workload images (broadest coverage; running
  # images covered even if a node agent is down). non-running = lighter, but
  # relies on node agents for all running-image coverage.
  imageInventoryMode: workload
  # Friendly cluster name for multi-cluster attribution. Published to the
  # vat-cluster-identity ConfigMap and used in k8s/node asset paths, the
  # X-VAT-Cluster header, and the cluster->tenant map. Leave empty to default to
  # the kube-system namespace UID (unique per cluster, collision-safe).
  clusterName: ""
  # Extra namespaces to skip during inventory/scan. The operator's own namespace
  # and the cluster system namespaces (kube-system/public/node-lease) are always
  # excluded; these are added on top.
  excludedNamespaces: []
  rescanIntervalSeconds: 3600
  maxConcurrentScanJobs: 5
  nodeScanning:
    enabled: false
  # Event-driven scanning is the production default: the informer creates a
  # ScanRequest per new digest (the backstop + GC run too). The inventory poll
  # stays as fallback. Roll back with eventDrivenScans=false; observe-only with
  # eventDrivenShadow=true.
  eventDrivenScans: true
  eventDrivenShadow: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

scanner:
  clusterName: cluster
  proxy:
    enabled: true
    httpProxy: http://vat-egress-proxy.vat.svc.cluster.local.:3128
    httpsProxy: http://vat-egress-proxy.vat.svc.cluster.local.:3128
    noProxy: .svc,.svc.cluster.local,.cluster.local,localhost,127.0.0.1,10.0.0.0/8,10.42.0.0/16,10.43.0.0/16,vat-backend.vat.svc.cluster.local
  image:
    repository: harbor.automatedhass.com/vat/scanner
    tag: latest
    pullPolicy: Always
  serviceAccountName: vat-operator-scanner
  worker:
    replicas: 1
    scanIntervalSeconds: 3600
    scanRetryIntervalSeconds: 300
    fullRescanIntervalSeconds: 86400
    # image-sca (Trivy) + image-grype (Grype 2nd-opinion SCA) + image-sbom (CycloneDX).
    scanTypes: image-sca,image-grype,image-sbom
    # Event-driven scan-queue consumer (production default on); inventory poll
    # stays as the fallback.
    scanQueueEnabled: true
    scanQueueIntervalSeconds: 15
    state:
      persistence:
        enabled: true
        existingClaim: ""
        storageClassName: ""
        size: 1Gi
    resources:
      requests:
        cpu: 150m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 3Gi
  configWorker:
    replicas: 1
    scanIntervalSeconds: 3600
    scanRetryIntervalSeconds: 300
    fullRescanIntervalSeconds: 86400
    state:
      persistence:
        enabled: true
        existingClaim: ""
        storageClassName: ""
        size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

imagePullSecrets:
  - harbor-creds

nodeAgent:
  enabled: true
  imagePullPolicy: Always
  runtimeProfile: generic
  scanTypes: node-stig,node-oval-cve
  # Phase 5: node agents do host scans only by default — the worker's registry
  # pull is the single image vantage. Set true for air-gapped on-node scanning.
  imageScans: false
  runtimeScanTypes: image-sca,image-grype,image-sbom,container-stig
  runtimeImagePullSecrets: ""
  scanIntervalSeconds: 86400
  runtimeFullRescanIntervalSeconds: 86400
  scanTimeoutSeconds: 600
  stateHostPath: /var/lib/vat-scanner/state
  containerdNamespace: k8s.io
  containerdSocketPath: /host/run/containerd/containerd.sock
  dockerSocketPath: /host/var/run/docker.sock
  kubeletRootPath: /host/var/lib/kubelet
  staticPodManifestPath: /host/etc/kubernetes/manifests
