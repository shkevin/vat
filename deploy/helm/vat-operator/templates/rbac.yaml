apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vat-operator
  labels:
    app.kubernetes.io/name: vat-operator
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "services", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vat-scan-inventory", "vat-k8s-inventory", "vat-cluster-identity"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["vat.io"]
    resources: ["vatoperatorconfigs", "scanpolicies", "scanreports"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # ScanRequests: operator owns creation + dedup + GC, so it also needs delete.
  - apiGroups: ["vat.io"]
    resources: ["scanrequests"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["vat.io"]
    resources: ["vatoperatorconfigs/status", "scanpolicies/status", "scanreports/status", "scanrequests/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vat-operator
  labels:
    app.kubernetes.io/name: vat-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vat-operator
subjects:
  - kind: ServiceAccount
    name: vat-operator
    namespace: {{ include "vat-operator.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vat-operator-scanner
  labels:
    app.kubernetes.io/name: vat-operator-scanner
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Worker (scan-queue consumer, Phase 3) claims pending ScanRequests and reports status.
  - apiGroups: ["vat.io"]
    resources: ["scanrequests"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["vat.io"]
    resources: ["scanrequests/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vat-operator-scanner
  labels:
    app.kubernetes.io/name: vat-operator-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vat-operator-scanner
subjects:
  - kind: ServiceAccount
    name: {{ .Values.scanner.serviceAccountName }}
    namespace: {{ include "vat-operator.namespace" . }}
{{- if .Values.nodeAgent.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vat-operator-node-agent
  labels:
    app.kubernetes.io/name: vat-operator-node-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["vat.io"]
    resources: ["scanreports"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["vat.io"]
    resources: ["scanreports/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vat-operator-node-agent
  labels:
    app.kubernetes.io/name: vat-operator-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vat-operator-node-agent
subjects:
  - kind: ServiceAccount
    name: {{ .Values.scanner.serviceAccountName }}
    namespace: {{ include "vat-operator.namespace" . }}
{{- end }}
