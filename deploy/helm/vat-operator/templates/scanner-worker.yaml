apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-scanner-worker
  namespace: {{ include "vat-operator.namespace" . }}
  labels:
    app.kubernetes.io/name: vat-scanner-worker
spec:
  replicas: {{ .Values.scanner.worker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-scanner-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-scanner-worker
    spec:
      serviceAccountName: {{ .Values.scanner.serviceAccountName }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: scanner
          image: {{ include "vat-operator.scannerImage" . }}
          imagePullPolicy: {{ .Values.scanner.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              prewarm_ingest_keys() {
                if [ -z "${VAT_ADMIN_TOKEN:-}" ]; then
                  return 0
                fi
                python - <<'PY'
              import os
              import sys
              from vat_scanner.cli import _ensure_parser_ingest_key

              vat_url = os.environ.get("VAT_URL", "").strip()
              admin_token = os.environ.get("VAT_ADMIN_TOKEN", "").strip()
              scan_types = {
                  item.strip()
                  for item in os.environ.get(
                      "VAT_INVENTORY_SCAN_TYPES", "image-sca,image-grype,image-sbom"
                  ).split(",")
                  if item.strip()
              }
              if not vat_url or not admin_token:
                  raise SystemExit(0)

              parsers = [("trivy", "container")]
              if "image-grype" in scan_types:
                  parsers.append(("grype", "container"))
              if "image-sbom" in scan_types:
                  parsers.append(("cyclonedx", "container"))
              # k8s config worker also runs gitleaks secret detection (repo asset).
              parsers.append(("gitleaks", "repo"))

              for parser_id, asset_type in parsers:
                  source_id, key = _ensure_parser_ingest_key(
                      vat_url,
                      admin_token,
                      parser_id,
                      asset_type=asset_type,
                  )
                  if not key:
                      raise SystemExit(f"{source_id}: no key")
                  print(f"prewarmed {source_id} ingest key", file=sys.stderr)
              PY
              }

              run_image_inventory_loop() {
                while true; do
                  if [ -s /image-inventory/images.json ]; then
                    if vat-scan scan-inventory /image-inventory/images.json \
                      --state-file /state/scan-state.json \
                      --scan-types "${VAT_INVENTORY_SCAN_TYPES:-image-sca,image-grype,image-sbom}" \
                      --full-rescan-interval-seconds "${VAT_FULL_RESCAN_INTERVAL_SECONDS:-86400}"; then
                      sleep "${VAT_SCAN_INTERVAL_SECONDS:-3600}"
                      continue
                    fi
                    echo "vat-scan scan-inventory failed; retrying sooner"
                    sleep "${VAT_SCAN_RETRY_INTERVAL_SECONDS:-300}"
                    continue
                  else
                    echo "waiting for vat-scan-inventory ConfigMap"
                  fi
                  sleep "${VAT_SCAN_INTERVAL_SECONDS:-3600}"
                done
              }

              run_k8s_inventory_loop() {
                while true; do
                  if [ -s /k8s-inventory/kubernetes.json.gz.b64 ]; then
                    if vat-scan scan-k8s-inventory /k8s-inventory/kubernetes.json.gz.b64 \
                      --state-file /state/k8s-scan-state.json \
                      --full-rescan-interval-seconds "${VAT_K8S_FULL_RESCAN_INTERVAL_SECONDS:-86400}"; then
                      sleep "${VAT_K8S_SCAN_INTERVAL_SECONDS:-3600}"
                      continue
                    fi
                    echo "vat-scan scan-k8s-inventory failed; retrying sooner"
                    sleep "${VAT_K8S_SCAN_RETRY_INTERVAL_SECONDS:-300}"
                    continue
                  else
                    echo "waiting for vat-k8s-inventory ConfigMap"
                  fi
                  sleep "${VAT_K8S_SCAN_INTERVAL_SECONDS:-3600}"
                done
              }

              run_scan_queue_loop() {
                while true; do
                  vat-scan scan-queue || echo "vat-scan scan-queue pass failed"
                  sleep "${VAT_SCAN_QUEUE_INTERVAL_SECONDS:-15}"
                done
              }

              prewarm_ingest_keys
              run_image_inventory_loop &
              run_k8s_inventory_loop &
              # Event-driven consumer (Phase 3): dormant until enabled; runs
              # alongside the inventory poll, which stays source of truth.
              if [ "${VAT_WORKER_SCAN_QUEUE_ENABLED:-false}" = "true" ]; then
                run_scan_queue_loop &
              fi
              wait
          env:
            - name: VAT_URL
              value: {{ .Values.vat.url | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VAT_WORKER_SCAN_QUEUE_ENABLED
              value: {{ .Values.scanner.worker.scanQueueEnabled | quote }}
            - name: VAT_SCAN_QUEUE_INTERVAL_SECONDS
              value: {{ .Values.scanner.worker.scanQueueIntervalSeconds | default 15 | quote }}
            - name: VAT_SCAN_INTERVAL_SECONDS
              value: {{ .Values.scanner.worker.scanIntervalSeconds | quote }}
            - name: VAT_SCAN_RETRY_INTERVAL_SECONDS
              value: {{ .Values.scanner.worker.scanRetryIntervalSeconds | quote }}
            - name: VAT_FULL_RESCAN_INTERVAL_SECONDS
              value: {{ .Values.scanner.worker.fullRescanIntervalSeconds | quote }}
            - name: VAT_INVENTORY_SCAN_TYPES
              value: {{ .Values.scanner.worker.scanTypes | quote }}
            - name: VAT_K8S_SCAN_INTERVAL_SECONDS
              value: {{ .Values.scanner.configWorker.scanIntervalSeconds | quote }}
            - name: VAT_K8S_SCAN_RETRY_INTERVAL_SECONDS
              value: {{ .Values.scanner.configWorker.scanRetryIntervalSeconds | quote }}
            - name: VAT_K8S_FULL_RESCAN_INTERVAL_SECONDS
              value: {{ .Values.scanner.configWorker.fullRescanIntervalSeconds | quote }}
            - name: VAT_CLUSTER_NAME
              value: {{ .Values.scanner.clusterName | quote }}
            # Own source-id namespace so the inventory worker mints its own
            # ingest keys (inventory-trivy, ...) instead of bare shared ones
            # that node agents / CI also write — no cross-writer key clobber.
            - name: VAT_SOURCE_ID_PREFIX
              value: inventory
            - name: VAT_SCANNER_KEY_CACHE_DIR
              value: /state
            {{- if .Values.scanner.proxy.enabled }}
            - name: HTTP_PROXY
              value: {{ .Values.scanner.proxy.httpProxy | quote }}
            - name: HTTPS_PROXY
              value: {{ .Values.scanner.proxy.httpsProxy | quote }}
            - name: NO_PROXY
              value: {{ .Values.scanner.proxy.noProxy | quote }}
            - name: http_proxy
              value: {{ .Values.scanner.proxy.httpProxy | quote }}
            - name: https_proxy
              value: {{ .Values.scanner.proxy.httpsProxy | quote }}
            - name: no_proxy
              value: {{ .Values.scanner.proxy.noProxy | quote }}
            {{- end }}
            - name: VAT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vat.credentialsSecretName }}
                  key: {{ .Values.vat.adminTokenKey }}
                  optional: true
          volumeMounts:
            - name: image-inventory
              mountPath: /image-inventory
              readOnly: true
            - name: k8s-inventory
              mountPath: /k8s-inventory
              readOnly: true
            - name: scanner-state
              mountPath: /state
          resources:
            {{- toYaml .Values.scanner.worker.resources | nindent 12 }}
      volumes:
        - name: image-inventory
          configMap:
            name: vat-scan-inventory
            optional: true
        - name: k8s-inventory
          configMap:
            name: vat-k8s-inventory
            optional: true
        - name: scanner-state
          {{- if .Values.scanner.worker.state.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default "vat-scanner-worker-state" .Values.scanner.worker.state.persistence.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
