apiVersion: v1
kind: Service
metadata:
  name: vat-frontend
  namespace: vat
  labels:
    app.kubernetes.io/name: vat-frontend
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: vat-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-frontend
  namespace: vat
  labels:
    app.kubernetes.io/name: vat-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-frontend
    spec:
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: web
          image: vat-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: vat-frontend
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
