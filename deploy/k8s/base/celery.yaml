apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-celery-worker-sync
  namespace: vat
  labels:
    app.kubernetes.io/name: vat-celery-worker-sync
    app.kubernetes.io/component: celery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-celery-worker-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-celery-worker-sync
    spec:
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: worker
          image: vat-backend
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --no-sync
            - celery
            - -A
            - app.celery_app
            - worker
            - -Q
            - vat-sync,vat-maintenance
            - --concurrency
            - "1"
            - -l
            - info
          envFrom:
            - secretRef:
                name: vat-runtime
          env:
            - name: VAT_ENV
              value: production
            - name: VAT_AIKIDO_CONTAINER_SBOM_SYNC
              value: "false"
            - name: VAT_AIKIDO_CONTAINER_SBOM_MAX_CONTAINERS
              value: "25"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-celery-worker-feeds
  namespace: vat
  labels:
    app.kubernetes.io/name: vat-celery-worker-feeds
    app.kubernetes.io/component: celery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-celery-worker-feeds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-celery-worker-feeds
    spec:
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: worker
          image: vat-backend
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --no-sync
            - celery
            - -A
            - app.celery_app
            - worker
            - -Q
            - vat-feeds
            - --concurrency
            - "1"
            - -l
            - info
          envFrom:
            - secretRef:
                name: vat-runtime
          env:
            - name: VAT_ENV
              value: production
            - name: VAT_VULN_FEEDS_ENABLED
              value: "false"
            - name: VAT_VULN_FEED_REFRESH_INTERVAL_HOURS
              value: "6"
            - name: VAT_VULN_FEED_MAX_RECORDS_PER_SOURCE
              value: "500"
            - name: VAT_VULN_FEED_OSV_MAX_QUERIES
              value: "250"
            - name: VAT_VULN_FEED_RECENT_WINDOW_DAYS
              value: "730"
            - name: VAT_VULN_FEED_RECORDS_RETENTION_DAYS
              value: "180"
            - name: VAT_VULN_FEED_RUNS_RETENTION_DAYS
              value: "30"
            - name: VAT_VULN_FEED_TASK_EXPIRES_SECONDS
              value: "3600"
            - name: VAT_VULN_FEED_DEBIAN_ENABLED
              value: "false"
            - name: VAT_VULN_FEED_UBUNTU_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
