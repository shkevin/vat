apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: vat
  labels:
    app.kubernetes.io/name: vat-valkey
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: vat-valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: vat
  labels:
    app.kubernetes.io/name: vat-valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:7-alpine
          args:
            - valkey-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
