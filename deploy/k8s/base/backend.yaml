apiVersion: v1
kind: Service
metadata:
  name: vat-backend
  namespace: vat
  labels:
    app.kubernetes.io/name: vat-backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: vat-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-backend
  namespace: vat
  labels:
    app.kubernetes.io/name: vat-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-backend
    spec:
      imagePullSecrets:
        - name: harbor-creds
      initContainers:
        - name: alembic-migrate
          image: vat-backend
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - alembic
            - upgrade
            - head
          envFrom:
            - secretRef:
                name: vat-runtime
          env:
            - name: VAT_ENV
              value: production
      containers:
        - name: api
          image: vat-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: vat-runtime
          env:
            - name: VAT_ENV
              value: production
            - name: VAT_RUN_MIGRATIONS
              value: "false"
            - name: VAT_UVICORN_WORKERS
              value: "2"
            - name: VAT_ALLOW_DEV_HEADERS
              value: "false"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
