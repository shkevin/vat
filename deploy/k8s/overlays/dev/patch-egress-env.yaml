apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-backend
  namespace: vat
spec:
  template:
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: api
          env:
            - name: HTTP_PROXY
              valueFrom:
                secretKeyRef:
                  name: vat-egress-proxy
                  key: HTTP_PROXY
                  optional: true
            - name: HTTPS_PROXY
              valueFrom:
                secretKeyRef:
                  name: vat-egress-proxy
                  key: HTTPS_PROXY
                  optional: true
            - name: NO_PROXY
              valueFrom:
                configMapKeyRef:
                  name: vat-egress-settings
                  key: NO_PROXY
                  optional: true
            - name: http_proxy
              valueFrom:
                secretKeyRef:
                  name: vat-egress-proxy
                  key: HTTP_PROXY
                  optional: true
            - name: https_proxy
              valueFrom:
                secretKeyRef:
                  name: vat-egress-proxy
                  key: HTTPS_PROXY
                  optional: true
            - name: no_proxy
              valueFrom:
                configMapKeyRef:
                  name: vat-egress-settings
                  key: NO_PROXY
                  optional: true
---
