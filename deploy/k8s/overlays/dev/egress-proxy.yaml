apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-egress-proxy
  namespace: vat
  labels:
    app.kubernetes.io/name: vat-egress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-egress-proxy
    spec:
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: proxy
          image: vat-backend
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /etc/proxy/proxy.py
          ports:
            - containerPort: 3128
              name: proxy
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/proxy/proxy.py
              subPath: proxy.py
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: proxy-config
          configMap:
            name: vat-egress-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: vat-egress-proxy
  namespace: vat
  labels:
    app.kubernetes.io/name: vat-egress-proxy
spec:
  selector:
    app.kubernetes.io/name: vat-egress-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
