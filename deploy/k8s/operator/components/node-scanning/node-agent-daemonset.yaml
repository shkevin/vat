apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vat-operator-node-agent
  namespace: vat-operator
  labels:
    app.kubernetes.io/name: vat-operator-node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-operator-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-operator-node-agent
    spec:
      serviceAccountName: vat-operator-scanner
      imagePullSecrets:
        - name: harbor-creds
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-agent
          image: harbor.automatedhass.com/vat/scanner:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              prewarm_node_ingest_keys() {
                if [ -z "${VAT_ADMIN_TOKEN:-}" ]; then
                  return 0
                fi
                python - <<'PY'
              import json
              import os
              import sys
              import urllib.request
              from pathlib import Path

              vat_url = os.environ.get("VAT_URL", "").rstrip("/")
              admin_token = os.environ.get("VAT_ADMIN_TOKEN", "").strip()
              prefix = (
                  os.environ.get("VAT_SOURCE_ID_PREFIX", "").strip()
                  or f"node-{os.environ.get('NODE_NAME', 'unknown-node')}"
              )
              cache_dir = Path(os.environ.get("VAT_SCANNER_KEY_CACHE_DIR", "/state"))
              cache_file = cache_dir / "scanner-keys.json"
              legacy_cache_file = Path.home() / ".config" / "vat" / "scanner-keys.json"
              runtime_scan_types = {
                  item.strip()
                  for item in os.environ.get(
                      "VAT_RUNTIME_SCAN_TYPES", "image-sca,image-sbom,container-stig"
                  ).split(",")
                  if item.strip()
              }
              node_scan_types = {
                  item.strip()
                  for item in os.environ.get(
                      "VAT_NODE_SCAN_TYPES", "node-stig,node-oval-cve"
                  ).split(",")
                  if item.strip()
              }

              if not vat_url or not admin_token:
                  raise SystemExit(0)

              parsers = []
              if "image-sca" in runtime_scan_types:
                  parsers.append(("trivy", "package"))
              if "image-sbom" in runtime_scan_types:
                  parsers.append(("cyclonedx", "package"))
              if "container-stig" in runtime_scan_types or "node-stig" in node_scan_types:
                  parsers.append(("openscap", "container"))
              if "node-oval-cve" in node_scan_types:
                  parsers.append(("openscap_oval", "container"))

              cache_dir.mkdir(parents=True, exist_ok=True)
              try:
                  cache = json.loads(cache_file.read_text(encoding="utf-8"))
              except Exception:
                  cache = {}

              def ensure(parser_id, asset_type, regenerate=False):
                  body = {
                      "parser": parser_id,
                      "sourceIdPrefix": prefix,
                      "assetType": asset_type,
                      "createKey": True,
                      "regenerateKey": regenerate,
                  }
                  req = urllib.request.Request(
                      f"{vat_url}/api/settings/sources/manual/ensure",
                      data=json.dumps(body).encode(),
                      method="POST",
                      headers={
                          "Authorization": f"Bearer {admin_token}",
                          "Content-Type": "application/json",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode())

              for parser_id, asset_type in parsers:
                  source_id = f"{prefix}-{parser_id}"
                  key = cache.get(source_id)
                  if not key:
                      data = ensure(parser_id, asset_type, regenerate=False)
                      key = data.get("key")
                      source_id = data.get("sourceId") or source_id
                  # No regenerate-on-miss: this node owns its prefixed source, but
                  # rotating still churns the shared key store. Persistent /state
                  # (hostPath) keeps the cache warm across restarts.
                  if not key:
                      raise SystemExit(f"{source_id}: no key")
                  cache[source_id] = key
                  print(f"prewarmed {source_id} ingest key", file=sys.stderr)

              cache_file.write_text(json.dumps(cache, indent=2), encoding="utf-8")
              cache_file.chmod(0o600)
              legacy_cache_file.parent.mkdir(parents=True, exist_ok=True)
              legacy_cache_file.write_text(json.dumps(cache, indent=2), encoding="utf-8")
              legacy_cache_file.chmod(0o600)
              PY
              }

              # Prewarm is best-effort: a transient backend blip must not crash
              # the container — the scan loop re-ensures keys with retry.
              prewarm_node_ingest_keys || echo "prewarm failed; scan loop will ensure keys"
              while true; do
                scan_ok=1
                # Image scanning is off by default (Phase 5): the worker's
                # registry-pull is the single image vantage, so node agents do
                # host scans only. Opt in (air-gapped: image cached on-node,
                # registry unreachable) with VAT_NODE_AGENT_IMAGE_SCANS=true.
                if [ "${VAT_NODE_AGENT_IMAGE_SCANS:-false}" = "true" ]; then
                  vat-scan scan-runtime \
                    --node-name "${NODE_NAME:-unknown-node}" \
                    --containerd-socket "${VAT_CONTAINERD_SOCKET_PATH:-/run/containerd/containerd.sock}" \
                    --containerd-namespace "${VAT_CONTAINERD_NAMESPACE:-k8s.io}" \
                    --docker-socket "${VAT_DOCKER_SOCKET_PATH:-/host/var/run/docker.sock}" \
                    --scan-types "${VAT_RUNTIME_SCAN_TYPES:-image-sca,image-sbom,container-stig}" \
                    --state-file /state/runtime-scan-state.json \
                    --full-rescan-interval-seconds "${VAT_RUNTIME_FULL_RESCAN_INTERVAL_SECONDS:-86400}" || scan_ok=0
                fi
                vat-scan scan-node \
                  --host-root "${VAT_HOST_ROOT:-/host}" \
                  --node-name "${NODE_NAME:-unknown-node}" \
                  --scan-types "${VAT_NODE_SCAN_TYPES:-node-stig,node-oval-cve}" \
                  --timeout "${VAT_NODE_SCAN_TIMEOUT_SECONDS:-600}" || scan_ok=0
                # Retry soon on failure instead of parking for a full interval —
                # a transient error must not blank out this node's coverage for 24h.
                if [ "$scan_ok" = 1 ]; then
                  sleep "${VAT_NODE_SCAN_INTERVAL_SECONDS:-86400}"
                else
                  echo "node scan cycle failed; retrying in ${VAT_NODE_SCAN_RETRY_INTERVAL_SECONDS:-300}s"
                  sleep "${VAT_NODE_SCAN_RETRY_INTERVAL_SECONDS:-300}"
                fi
              done
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          env:
            - name: VAT_URL
              value: http://vat-backend.vat.svc.cluster.local:8000
            - name: VAT_CLUSTER_NAME
              value: cluster
            - name: VAT_OPERATOR_RUNTIME_PROFILE
              value: generic
            - name: VAT_CONTAINERD_SOCKET_PATH
              value: /host/run/containerd/containerd.sock
            - name: VAT_CONTAINERD_NAMESPACE
              value: k8s.io
            - name: VAT_DOCKER_SOCKET_PATH
              value: /host/var/run/docker.sock
            - name: VAT_KUBELET_ROOT_PATH
              value: /host/var/lib/kubelet
            - name: VAT_STATIC_POD_MANIFEST_PATH
              value: /host/etc/kubernetes/manifests
            - name: VAT_HOST_ROOT
              value: /host
            - name: VAT_NODE_SCAN_TYPES
              value: node-stig,node-oval-cve
            # Phase 5: node agents do host scans only by default; the worker's
            # registry pull is the single image vantage. Set true for air-gapped.
            - name: VAT_NODE_AGENT_IMAGE_SCANS
              value: "false"
            - name: VAT_RUNTIME_SCAN_TYPES
              value: image-sca,image-sbom,container-stig
            - name: VAT_RUNTIME_IMAGE_PULL_SECRETS
              value: vat-operator/harbor-creds
            - name: VAT_NODE_SCAN_INTERVAL_SECONDS
              value: "86400"
            - name: VAT_RUNTIME_FULL_RESCAN_INTERVAL_SECONDS
              value: "86400"
            - name: VAT_NODE_SCAN_TIMEOUT_SECONDS
              value: "600"
            - name: HTTP_PROXY
              value: http://vat-egress-proxy.vat.svc.cluster.local.:3128
            - name: HTTPS_PROXY
              value: http://vat-egress-proxy.vat.svc.cluster.local.:3128
            - name: NO_PROXY
              value: .svc,.svc.cluster.local,.cluster.local,localhost,127.0.0.1,10.0.0.0/8,10.42.0.0/16,10.43.0.0/16,vat-backend.vat.svc.cluster.local
            - name: http_proxy
              value: http://vat-egress-proxy.vat.svc.cluster.local.:3128
            - name: https_proxy
              value: http://vat-egress-proxy.vat.svc.cluster.local.:3128
            - name: no_proxy
              value: .svc,.svc.cluster.local,.cluster.local,localhost,127.0.0.1,10.0.0.0/8,10.42.0.0/16,10.43.0.0/16,vat-backend.vat.svc.cluster.local
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VAT_SOURCE_ID_PREFIX
              value: node-$(NODE_NAME)
            - name: VAT_SCANNER_KEY_CACHE_DIR
              value: /state
            - name: VAT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vat-operator-credentials
                  key: adminToken
                  optional: true
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
            - name: scanner-tmp
              mountPath: /tmp
            - name: scanner-state
              mountPath: /state
            - name: scanner-state
              mountPath: /root/.config
      volumes:
        - name: host-root
          hostPath:
            path: /
        - name: scanner-tmp
          emptyDir: {}
        - name: scanner-state
          hostPath:
            path: /var/lib/vat-scanner/state
            type: DirectoryOrCreate
