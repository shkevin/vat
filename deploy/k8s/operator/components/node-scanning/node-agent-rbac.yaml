apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vat-operator-node-agent
  labels:
    app.kubernetes.io/name: vat-operator-node-agent
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["vat.io"]
    resources:
      - scanreports
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["vat.io"]
    resources:
      - scanreports/status
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vat-operator-node-agent
  labels:
    app.kubernetes.io/name: vat-operator-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vat-operator-node-agent
subjects:
  - kind: ServiceAccount
    name: vat-operator-scanner
    namespace: vat-operator
