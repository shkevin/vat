apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scanreports.vat.io
spec:
  group: vat.io
  scope: Namespaced
  names:
    plural: scanreports
    singular: scanreport
    kind: ScanReport
    shortNames:
      - vsr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Target
          type: string
          jsonPath: .spec.target.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - target
              properties:
                target:
                  type: object
                  required:
                    - namespace
                    - kind
                    - name
                  properties:
                    namespace:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    uid:
                      type: string
                    containerName:
                      type: string
                    image:
                      type: string
                    imageDigest:
                      type: string
                runtimeProfile:
                  type: string
                  enum:
                    - generic
                    - kind
                    - k0s
                    - k3s
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                scanJobName:
                  type: string
                vatTraceId:
                  type: string
                findingCounts:
                  type: object
                  additionalProperties:
                    type: integer
                error:
                  type: string
      subresources:
        status: {}
