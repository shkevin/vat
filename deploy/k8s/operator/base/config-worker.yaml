apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-config-worker
  namespace: vat-operator
  labels:
    app.kubernetes.io/name: vat-config-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-config-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-config-worker
    spec:
      serviceAccountName: vat-operator-scanner
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: scanner
          image: harbor.automatedhass.com/vat/scanner:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                if [ -s /inventory/kubernetes.json.gz.b64 ]; then
                  vat-scan scan-k8s-inventory /inventory/kubernetes.json.gz.b64 \
                    --state-file /state/k8s-scan-state.json \
                    --full-rescan-interval-seconds "${VAT_K8S_FULL_RESCAN_INTERVAL_SECONDS:-86400}" || true
                else
                  echo "waiting for vat-k8s-inventory ConfigMap"
                fi
                sleep "${VAT_K8S_SCAN_INTERVAL_SECONDS:-3600}"
              done
          env:
            - name: VAT_URL
              value: http://vat-backend.vat.svc.cluster.local:8000
            - name: VAT_K8S_SCAN_INTERVAL_SECONDS
              value: "3600"
            - name: VAT_K8S_FULL_RESCAN_INTERVAL_SECONDS
              value: "86400"
            - name: VAT_CLUSTER_NAME
              value: cluster
            - name: HTTP_PROXY
              value: http://vat-egress-proxy.vat.svc.cluster.local.:3128
            - name: HTTPS_PROXY
              value: http://vat-egress-proxy.vat.svc.cluster.local.:3128
            - name: NO_PROXY
              value: .svc,.svc.cluster.local,.cluster.local,localhost,127.0.0.1,10.0.0.0/8,10.42.0.0/16,10.43.0.0/16,vat-backend.vat.svc.cluster.local
            - name: http_proxy
              value: http://vat-egress-proxy.vat.svc.cluster.local.:3128
            - name: https_proxy
              value: http://vat-egress-proxy.vat.svc.cluster.local.:3128
            - name: no_proxy
              value: .svc,.svc.cluster.local,.cluster.local,localhost,127.0.0.1,10.0.0.0/8,10.42.0.0/16,10.43.0.0/16,vat-backend.vat.svc.cluster.local
            - name: VAT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vat-operator-credentials
                  key: apiKey
                  optional: true
            - name: VAT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vat-operator-credentials
                  key: adminToken
                  optional: true
          volumeMounts:
            - name: inventory
              mountPath: /inventory
              readOnly: true
            - name: scanner-state
              mountPath: /state
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: inventory
          configMap:
            name: vat-k8s-inventory
            optional: true
        - name: scanner-state
          emptyDir: {}
