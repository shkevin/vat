apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-operator
  namespace: vat-operator
  labels:
    app.kubernetes.io/name: vat-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-operator
    spec:
      serviceAccountName: vat-operator
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: operator
          image: harbor.automatedhass.com/vat/operator:latest
          imagePullPolicy: Always
          env:
            - name: VAT_URL
              value: http://vat-backend.vat.svc.cluster.local:8000
            - name: VAT_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VAT_OPERATOR_SCANNER_IMAGE
              value: harbor.automatedhass.com/vat/scanner:latest
            - name: VAT_OPERATOR_CREDENTIAL_SECRET
              value: vat-operator-credentials
            - name: VAT_OPERATOR_RUNTIME_PROFILE
              value: auto
            # workload = inventory worker scans ALL desired-state workload
            # images (not just non-running ones). Node agents add runtime depth
            # on top; the overlap is deliberate so running-image coverage does
            # not depend on per-node agent health (which can fail/parked).
            - name: VAT_OPERATOR_IMAGE_INVENTORY_MODE
              value: workload
            - name: VAT_OPERATOR_NODE_SCANNING_ENABLED
              value: "false"
            # Event-driven informer. SCANS gates the whole path (off = pure poll).
            # SHADOW=true logs only; flip to "false" to actually create
            # ScanRequests (Phase 4). Backstop + GC run only in active mode.
            - name: VAT_OPERATOR_EVENT_DRIVEN_SCANS
              value: "false"
            - name: VAT_OPERATOR_EVENT_DRIVEN_SHADOW
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
