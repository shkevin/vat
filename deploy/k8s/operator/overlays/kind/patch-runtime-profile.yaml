apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-operator
  namespace: vat-operator
spec:
  template:
    spec:
      containers:
        - name: operator
          env:
            # Friendly cluster name -> published to vat-cluster-identity ConfigMap;
            # pods source VAT_CLUSTER_NAME from it. Unset -> <runtime-profile>-<short-uid> (e.g. kind-1a2b3c4d).
            - name: VAT_OPERATOR_CLUSTER_NAME
              value: kind
            - name: VAT_OPERATOR_RUNTIME_PROFILE
              value: kind
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vat-operator-node-agent
  namespace: vat-operator
spec:
  template:
    spec:
      containers:
        - name: node-agent
          env:
            - name: VAT_OPERATOR_RUNTIME_PROFILE
              value: kind
            - name: VAT_CONTAINERD_SOCKET_PATH
              value: /host/run/containerd/containerd.sock
            - name: VAT_KUBELET_ROOT_PATH
              value: /host/var/lib/kubelet
            - name: VAT_STATIC_POD_MANIFEST_PATH
              value: /host/etc/kubernetes/manifests
