# VAT project pre-commit configuration.
# Goal: fast, reliable commit-time checks for changed files.
# Install: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.yml|.*\.yaml)$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=10000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff-format
        name: "backend: ruff format"
        files: ^backend/.*\.py$
      - id: ruff
        name: "backend: ruff lint (manual)"
        files: ^backend/.*\.py$
        stages: [manual]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: "frontend: prettier"
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|scss|md)$
        exclude: ^frontend/(node_modules|dist|build|\.next)/

  # Optional heavy checks (manual only):
  # Run explicitly with:
  #   pre-commit run --hook-stage manual mypy
  #   pre-commit run --hook-stage manual bandit
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        name: "backend: mypy (manual)"
        files: ^backend/.*\.py$
        stages: [manual]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        name: "backend: bandit (manual)"
        files: ^backend/.*\.py$
        exclude: ^backend/(tests|migrations|alembic)/.*\.py$
        stages: [manual]
