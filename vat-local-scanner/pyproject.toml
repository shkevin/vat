[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vat-scanner"
version = "0.1.0"
description = "VAT Local Scanner — standalone CLI that runs security scans locally and pushes only findings to VAT"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Kevin Cox" }]
keywords = ["security", "scanner", "vat", "trivy", "grype", "semgrep"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
vat-scan = "vat_scanner.cli:main"

[project.urls]
Repository = "https://github.com/example/vat"

[tool.setuptools.packages.find]
include = ["vat_scanner*"]
