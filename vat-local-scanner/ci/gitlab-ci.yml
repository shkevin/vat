# VAT Local Scanner — GitLab CI
# Add to .gitlab-ci.yml or include in your pipeline
#
# Variables: VAT_URL, VAT_ADMIN_TOKEN (Settings → CI/CD → Variables, masked)

vat-scan:
  image: python:3.11-slim-bookworm
  before_script:
    - pip install vat-scanner
    - apt-get update && apt-get install -y curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - |
      vat-scan scan . \
        --asset "$CI_PROJECT_NAME" \
        --gating-mode pr \
        --fail-on high \
        --base-commit-id ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_SHA} \
        --head-commit-id $CI_COMMIT_SHA \
        --gating-result-output gating-result.json
  variables:
    VAT_URL: $VAT_URL
    VAT_ADMIN_TOKEN: $VAT_ADMIN_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
