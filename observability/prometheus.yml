global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: vat-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: vat-loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: vat-tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: vat-promtail
    metrics_path: /metrics
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: vat-otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]

