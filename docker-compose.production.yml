# Production Docker Compose for VAT
# Usage: docker compose -f docker-compose.production.yml up -d
#
# Required: Create .env.production (or set env vars) with:
#   VAT_SECRET_KEY, VAT_DATABASE_URL, VAT_CELERY_BROKER_URL,
#   VAT_CORS_ORIGINS, VAT_PUBLIC_URL, VAT_FRONTEND_URL
#   (Optional: VAT_AIKIDO_*, VAT_LINEAR_*, VAT_GOOGLE_* for integrations)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-vat}
    volumes:
      - vat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vat} -d ${POSTGRES_DB:-vat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Uncomment to expose for external tools; prefer keeping internal-only
    # ports:
    #   - "5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: ${POSTGRES_USER:-vat}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-vat}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 50
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:7-alpine
    volumes:
      - vat_valkey_data:/data
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Uncomment to expose for external tools
    # ports:
    #   - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      VAT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vat}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-vat}
      VAT_CELERY_BROKER_URL: redis://valkey:6379/0
      VAT_ENV: production
      VAT_RUN_MIGRATIONS: "false"
      VAT_UVICORN_WORKERS: ${VAT_UVICORN_WORKERS:-3}
      VAT_PUBLIC_URL: ${VAT_PUBLIC_URL:-http://localhost:8000}
      VAT_FRONTEND_URL: ${VAT_FRONTEND_URL:-http://localhost:3000}
      VAT_CORS_ORIGINS: ${VAT_CORS_ORIGINS:-http://localhost:3000}
      VAT_ALLOW_DEV_HEADERS: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        API_UPSTREAM_URL: ${API_UPSTREAM_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      APP_NAME: ${APP_NAME:-VAT}
      APP_LOGO: ${APP_LOGO:-/vat-logo-dark.svg}
      CLASSIFICATION: ${CLASSIFICATION:-}
      SEARCH_PLACEHOLDER: ${SEARCH_PLACEHOLDER:-Find by CVE, component, team…}
      SHOW_THEME_TOGGLE: ${SHOW_THEME_TOGGLE:-false}
      ENV_LABEL: ${ENV_LABEL:-}
      FOOTER_CLASSIFICATION: ${FOOTER_CLASSIFICATION:-}
      FOOTER_SUFFIX: ${FOOTER_SUFFIX:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file:
      - .env.production
    environment:
      VAT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vat}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-vat}
      VAT_CELERY_BROKER_URL: redis://valkey:6379/0
      VAT_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: "no"

  celery-worker-sync:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uv", "run", "celery", "-A", "app.celery_app", "worker", "-Q", "vat-sync,vat-maintenance", "-l", "info"]
    env_file:
      - .env.production
    environment:
      VAT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vat}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-vat}
      VAT_CELERY_BROKER_URL: redis://valkey:6379/0
      VAT_ENV: production
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped

  celery-worker-feeds:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uv", "run", "celery", "-A", "app.celery_app", "worker", "-Q", "vat-feeds", "-l", "info"]
    env_file:
      - .env.production
    environment:
      VAT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vat}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-vat}
      VAT_CELERY_BROKER_URL: redis://valkey:6379/0
      VAT_ENV: production
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uv", "run", "celery", "-A", "app.celery_app", "beat", "-l", "info"]
    env_file:
      - .env.production
    environment:
      VAT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vat}
      VAT_CELERY_BROKER_URL: redis://valkey:6379/0
      VAT_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vat_postgres_data:
  vat_valkey_data:
