# VAT CI — validate Kubernetes manifests and build + push container images to
# the in-cluster Harbor registry so Argo CD can pull them.
#
# Required GitLab CI/CD variables (Settings → CI/CD → Variables):
#   HARBOR_USER   masked, protected — Harbor robot or user with push to project "vat"
#   HARBOR_TOKEN  masked, protected — PAT/robot token with push rights on project "vat"
#
# Optional:
#   SOPS_AGE_KEY  masked, protected, file — age private key matching .sops.yaml
#                 recipient. If set, the overlay validate job will render with
#                 KSOPS; if unset, overlay validate is skipped and only the
#                 KSOPS-free base is validated.
#   HARBOR_DOCKERHUB_PROXY_PROJECT — Harbor proxy-cache project for Docker Hub
#                 base images. Defaults to "dockerhub"; set empty to disable.
#   KANIKO_SKIP_DEFAULT_REGISTRY_FALLBACK — "true" fails fast if the proxy
#                 cannot serve an image instead of falling back to Docker Hub.

stages:
  - validate
  - build

variables:
  HARBOR_HOST: harbor.automatedhass.com
  HARBOR_PROJECT: vat
  HARBOR_DOCKERHUB_PROXY_PROJECT: dockerhub
  KANIKO_SKIP_DEFAULT_REGISTRY_FALLBACK: "true"
  # Folder inside the repo that carries the manifests.
  K8S_ROOT: deploy/k8s
  # Same flags the kamiwaza-argocd Argo repo-server uses; both are required for
  # KSOPS generators in nested builds to resolve.
  KUSTOMIZE_FLAGS: "--enable-alpha-plugins --enable-exec"

# ---------- validate ----------

# KSOPS-free sanity check: the base has no encrypted secrets, so it's safe to
# render on any runner without the age key. Guarantees namespace/Deployment
# YAML parses and kustomize resolves.
validate:base:
  stage: validate
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - kubectl kustomize ${K8S_ROOT}/base >/dev/null
    - kubectl kustomize ${K8S_ROOT}/operator/base >/dev/null
    - kubectl kustomize ${K8S_ROOT}/operator/overlays/kind >/dev/null
    - kubectl kustomize ${K8S_ROOT}/operator/overlays/k0s >/dev/null
    - kubectl kustomize ${K8S_ROOT}/operator/overlays/k3s >/dev/null
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

validate:operator:
  stage: validate
  image: golang:1.20
  script:
    - cd operator
    - go test ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

validate:operator:helm:
  stage: validate
  image:
    name: alpine/helm:3.15.4
    entrypoint: [""]
  script:
    - helm template vat-operator deploy/helm/vat-operator --namespace vat-operator --include-crds >/dev/null
    - helm template vat-operator deploy/helm/vat-operator --namespace vat-operator --include-crds --set nodeAgent.enabled=true --set operator.runtimeProfile=k0s --set nodeAgent.runtimeProfile=k0s --set nodeAgent.containerdSocketPath=/host/run/k0s/containerd.sock --set nodeAgent.kubeletRootPath=/host/var/lib/k0s/kubelet --set nodeAgent.staticPodManifestPath=/host/var/lib/k0s/manifests >/dev/null
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Full overlay render (incl. KSOPS). Only runs when SOPS_AGE_KEY is set so the
# default pipeline still passes for MRs from forks without the key.
validate:overlays:
  stage: validate
  image: alpine:3.20
  before_script:
    # kustomize, sops, age, ksops into /usr/local/bin
    - apk add --no-cache curl tar bash ca-certificates
    - KUSTOMIZE_VERSION=v5.4.3
    - curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
      | tar -xz -C /usr/local/bin
    - SOPS_VERSION=v3.9.1
    - curl -sSL -o /usr/local/bin/sops
      "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
    - chmod +x /usr/local/bin/sops
    - AGE_VERSION=v1.2.0
    - curl -sSL "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
      | tar -xz --strip-components=1 -C /usr/local/bin age/age age/age-keygen
    - KSOPS_VERSION=v4.3.2
    - mkdir -p "${HOME}/.config/kustomize/plugin/viaduct.ai/v1/ksops"
    - curl -sSL "https://github.com/viaduct-ai/kustomize-sops/releases/download/${KSOPS_VERSION}/ksops_${KSOPS_VERSION#v}_Linux_x86_64.tar.gz"
      | tar -xz -C "${HOME}/.config/kustomize/plugin/viaduct.ai/v1/ksops"
    - install -m 0755 "${HOME}/.config/kustomize/plugin/viaduct.ai/v1/ksops/ksops" /usr/local/bin/ksops
    - export SOPS_AGE_KEY_FILE="${SOPS_AGE_KEY}"
  script:
    - kustomize build ${KUSTOMIZE_FLAGS} ${K8S_ROOT}/overlays/dev  >/dev/null
    - kustomize build ${KUSTOMIZE_FLAGS} ${K8S_ROOT}/overlays/prod >/dev/null
  rules:
    - if: '$SOPS_AGE_KEY && ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH || $CI_COMMIT_TAG)'

# ---------- build ----------

# Kaniko-based build so runners don't need docker-in-docker / privileged mode.
# Each child job sets COMPONENT, CONTEXT, and DOCKERFILE; the template handles
# auth + tag-list computation identically.
.image-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    # Overridden per-job
    COMPONENT: ""
    CONTEXT: ""
    DOCKERFILE: "Dockerfile"
  before_script:
    - |
      if [ -z "${HARBOR_USER:-}" ] || [ -z "${HARBOR_TOKEN:-}" ]; then
        echo "HARBOR_USER and HARBOR_TOKEN must be set as CI/CD variables" >&2
        exit 2
      fi
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "${HARBOR_USER}" "${HARBOR_TOKEN}" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${HARBOR_HOST}" "${AUTH}" > /kaniko/.docker/config.json
    - |
      IMAGE="${HARBOR_HOST}/${HARBOR_PROJECT}/${COMPONENT}"
      DESTINATIONS="--destination=${IMAGE}:sha-${CI_COMMIT_SHORT_SHA}"
      if [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        DESTINATIONS="${DESTINATIONS} --destination=${IMAGE}:latest"
      elif [ "${CI_COMMIT_BRANCH:-}" = "develop" ]; then
        DESTINATIONS="${DESTINATIONS} --destination=${IMAGE}:develop"
      fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        DESTINATIONS="${DESTINATIONS} --destination=${IMAGE}:${CI_COMMIT_TAG}"
      fi
      echo "${DESTINATIONS}" > /tmp/kaniko-destinations
      echo "Pushing: ${DESTINATIONS}"
  script:
    - |
      KANIKO_EXTRA_ARGS=""
      KANIKO_REGISTRY_ARGS=""
      if [ -n "${HARBOR_DOCKERHUB_PROXY_PROJECT:-}" ]; then
        KANIKO_REGISTRY_ARGS="--registry-map=index.docker.io=${HARBOR_HOST}/${HARBOR_DOCKERHUB_PROXY_PROJECT} --registry-map=docker.io=${HARBOR_HOST}/${HARBOR_DOCKERHUB_PROXY_PROJECT}"
        if [ "${KANIKO_SKIP_DEFAULT_REGISTRY_FALLBACK:-true}" = "true" ]; then
          KANIKO_REGISTRY_ARGS="${KANIKO_REGISTRY_ARGS} --skip-default-registry-fallback"
        fi
      fi
      # Next.js rewrites bake API_UPSTREAM_URL at build time. Docker Compose uses
      # hostname "backend"; in Kubernetes the Service is vat-backend.
      if [ "${COMPONENT}" = "frontend" ]; then
        KANIKO_EXTRA_ARGS='--build-arg API_UPSTREAM_URL=http://vat-backend:8000'
      fi
      /kaniko/executor \
        ${KANIKO_REGISTRY_ARGS} \
        --context "${CI_PROJECT_DIR}/${CONTEXT}" \
        --dockerfile "${CI_PROJECT_DIR}/${CONTEXT}/${DOCKERFILE}" \
        --cache=true \
        --cache-repo="${HARBOR_HOST}/${HARBOR_PROJECT}/${COMPONENT}/cache" \
        --snapshot-mode=redo \
        ${KANIKO_EXTRA_ARGS} \
        ${KANIKO_NO_PUSH:-} \
        $(cat /tmp/kaniko-destinations)
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG
    # Dry-run on MRs: build without pushing so rendering breakage is caught.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        KANIKO_NO_PUSH: "--no-push"

build:backend:
  extends: .image-build
  variables:
    COMPONENT: backend
    CONTEXT: backend
    DOCKERFILE: Dockerfile

build:frontend:
  extends: .image-build
  variables:
    COMPONENT: frontend
    CONTEXT: frontend
    DOCKERFILE: Dockerfile.production

build:scanner:
  extends: .image-build
  variables:
    COMPONENT: scanner
    CONTEXT: vat-local-scanner
    DOCKERFILE: Dockerfile

build:operator:
  extends: .image-build
  variables:
    COMPONENT: operator
    CONTEXT: operator
    DOCKERFILE: Dockerfile
